name: Patch V23.17 random booster hotfix

on:
  push:
    branches: [main]
    paths:
      - '.v2317-random-hotfix-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beyblade-x-site
          fetch-depth: 0
      - run: git show origin/main:.patch-v2317-random-hotfix.py > /tmp/patch.py
      - name: Patch and verify
        run: |
          python /tmp/patch.py
          grep -q 'function stockUsesCXStructure' index.html
          grep -q 'Only replace the' index.html
          grep -q 'stockUsesCXStructure(b)?"cx":"classic"' index.html
      - name: Commit to site branch
        run: |
          git config user.name "godsiman"
          git config user.email "120441322+godsiman@users.noreply.github.com"
          git add index.html
          git commit -m "V23.17 fix mixed-line random booster variants" || exit 0
          git push origin HEAD:beyblade-x-site
