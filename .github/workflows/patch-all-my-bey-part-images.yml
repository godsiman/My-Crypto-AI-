name: Patch all My Bey product images

on:
  push:
    branches:
      - main
    paths:
      - .all-my-bey-part-images-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: beyblade-x-site
          fetch-depth: 0

      - name: Load patch script from main
        run: |
          git fetch origin main
          git show origin/main:.patch-v2316.py > /tmp/patch-v2316.py

      - name: Patch and verify
        run: |
          python /tmp/patch-v2316.py
          grep -q 'V23.16' index.html
          grep -q 'function garageStockPartImage' index.html
          grep -q 'const strictProductImages=true' index.html
          grep -q 'beyId:b.id' index.html
          if grep -A90 'function garageEntryPartImage' index.html | grep -q 'return findImage(p)'; then
            echo 'Unsafe generic image fallback still exists'
            exit 1
          fi

      - name: Commit to site branch
        run: |
          git config user.name godsiman
          git config user.email 120441322+godsiman@users.noreply.github.com
          git add index.html
          git commit -m 'V23.16 audit all My Bey product-specific part images'
          git push origin HEAD:beyblade-x-site
