name: Patch Auto Build battle theory mode

on:
  push:
    branches: [main]
    paths:
      - '.auto-build-mode-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beyblade-x-site
          fetch-depth: 0

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          # Version.
          one('>V23.8</span>','>V23.9</span>','version')

          # State: remember battle/theory choice.
          old='''    garageItems:safeJsonArray("beyx-garage"),\n    garageResults:[],\n    autoBuildRegion:safeStoreGet("beyx-auto-region","global") || "global"\n  };'''
          new='''    garageItems:safeJsonArray("beyx-garage"),\n    garageResults:[],\n    autoBuildMode:safeStoreGet("beyx-auto-mode","battle") || "battle",\n    autoBuildRegion:safeStoreGet("beyx-auto-region","global") || "global"\n  };'''
          one(old,new,'state')

          # Small style accent for theory mode; reuse existing two-column tab styling.
          css='''    .autoBuildRegionTabs button[data-auto-region="taiwan"].active{background:#123127;color:#7ce5ba;box-shadow:inset 0 0 0 1px rgba(41,211,145,.38)}\n'''
          css_new=css+'''    .autoBuildModeTabs button[data-auto-mode="theory"].active{background:#332914;color:#ffe08a;box-shadow:inset 0 0 0 1px rgba(255,208,90,.38)}\n'''
          one(css,css_new,'mode css')

          # UI: add recommendation mode above region tabs.
          old='''          <p id="autoBuildDesc">按「幫我配前 10 名」後，優先使用實際賽場配裝；不足 10 組時再用理論能力補位。</p>\n        </div>\n        <div class="autoBuildLegend">\n          <span class="evidenceMeta">賽場實證</span>\n          <span class="evidenceTheory">理論補位</span>\n        </div>\n      </div>\n      <div id="autoBuildRegionTabs" class="autoBuildRegionTabs" aria-label="Auto Build 賽場地區">'''
          new='''          <p id="autoBuildDesc">先選「實戰最佳」或「理論最佳」，再用你目前擁有的零件排出前 10 名。</p>\n        </div>\n        <div class="autoBuildLegend">\n          <span class="evidenceMeta">賽場實證</span>\n          <span class="evidenceTheory">理論能力</span>\n        </div>\n      </div>\n      <div id="autoBuildModeTabs" class="autoBuildRegionTabs autoBuildModeTabs" aria-label="Auto Build 推薦方式">\n        <button type="button" class="active" data-auto-mode="battle">🏆 實戰最佳</button>\n        <button type="button" data-auto-mode="theory">🧪 理論最佳</button>\n      </div>\n      <div id="autoBuildRegionTabs" class="autoBuildRegionTabs" aria-label="Auto Build 賽場地區">'''
          one(old,new,'mode html')

          # Candidate generation: battle mode = tournament first + theory fallback; theory mode = theory only.
          old='''    const autoRegion=state.autoBuildRegion==="taiwan"?"taiwan":"global";\n    for(const blade of blades){\n      if(autoRegion==="global"){\n        for(const b of globalRecoBuilds(blade)){\n          const r=b.ratchet?findPart("ratchet",b.ratchet):null, bit=b.bit?findPart("bit",b.bit):null;\n          if(bit) addCandidate(blade,r,bit,"meta",metaScoreForCandidate(blade,b),`全球賽場：${b.evidence||""}`);\n        }\n      }else{\n        for(const b of taiwanRecoBuilds(blade)){\n          const r=b.ratchet?findPart("ratchet",b.ratchet):null, bit=b.bit?findPart("bit",b.bit):null;\n          if(bit) addCandidate(blade,r,bit,"taiwan",760-b.rank*8,`台灣實戰：${b.evidence||""}`);\n        }\n      }\n    }\n\n    for(const blade of blades){\n      const local=[];\n      for(const r of ratchets) for(const bit of bits) local.push({r,bit,score:theoryScoreParts(blade,r,bit)});\n      local.sort((a,b)=>b.score-a.score);\n      for(const x of local.slice(0,12)) addCandidate(blade,x.r,x.bit,"theory",x.score,`${typeLabelZh(blade.type)}型理論能力補位`);\n    }'''
          new='''    const autoMode=state.autoBuildMode==="theory"?"theory":"battle";\n    const autoRegion=state.autoBuildRegion==="taiwan"?"taiwan":"global";\n    if(autoMode==="battle"){\n      for(const blade of blades){\n        if(autoRegion==="global"){\n          for(const b of globalRecoBuilds(blade)){\n            const r=b.ratchet?findPart("ratchet",b.ratchet):null, bit=b.bit?findPart("bit",b.bit):null;\n            if(bit) addCandidate(blade,r,bit,"meta",metaScoreForCandidate(blade,b),`全球賽場：${b.evidence||""}`);\n          }\n        }else{\n          for(const b of taiwanRecoBuilds(blade)){\n            const r=b.ratchet?findPart("ratchet",b.ratchet):null, bit=b.bit?findPart("bit",b.bit):null;\n            if(bit) addCandidate(blade,r,bit,"taiwan",760-b.rank*8,`台灣實戰：${b.evidence||""}`);\n          }\n        }\n      }\n    }\n\n    for(const blade of blades){\n      const local=[];\n      for(const r of ratchets) for(const bit of bits) local.push({r,bit,score:theoryScoreParts(blade,r,bit)});\n      local.sort((a,b)=>b.score-a.score);\n      for(const x of local.slice(0,12)) addCandidate(blade,x.r,x.bit,"theory",x.score,autoMode==="theory"?`${typeLabelZh(blade.type)}型｜純理論能力排序`:`${typeLabelZh(blade.type)}型理論能力補位`);\n    }'''
          one(old,new,'candidate mode')

          # Result summary text depends on selected mode.
          old='''    state.garageResults=chosen; renderGarageResults();\n    const regionLabel=state.autoBuildRegion==="taiwan"?"台灣實戰":"全球賽場";\n    $("#autoBuildDesc").textContent=`${unique?"零件不重複・可同時組裝":"可重複・候選配法"}｜${regionLabel}｜共找到 ${chosen.length} 組；該賽場資料不足時再用理論能力補位。`;\n    toast(`已排出 ${chosen.length} 組｜${regionLabel}`);'''
          new='''    state.garageResults=chosen; renderGarageResults();\n    const autoMode=state.autoBuildMode==="theory"?"theory":"battle";\n    const regionLabel=state.autoBuildRegion==="taiwan"?"台灣實戰":"全球賽場";\n    const modeLabel=autoMode==="theory"?"理論最佳":"實戰最佳";\n    $("#autoBuildDesc").textContent=autoMode==="theory"\n      ? `${unique?"零件不重複・可同時組裝":"可重複・候選配法"}｜${modeLabel}｜共找到 ${chosen.length} 組；只依你目前零件的理論能力排序，不使用賽場資料。`\n      : `${unique?"零件不重複・可同時組裝":"可重複・候選配法"}｜${modeLabel}｜${regionLabel}｜共找到 ${chosen.length} 組；賽場資料不足時再用理論能力補位。`;\n    toast(`已排出 ${chosen.length} 組｜${modeLabel}${autoMode==="battle"?"｜"+regionLabel:""}`);'''
          one(old,new,'generate summary')

          # Card badge says theory best when theory mode is selected.
          old='''      const kind=c.kind==="theory"?"理論補位":c.kind==="taiwan"?"台灣實戰":"全球賽場";'''
          new='''      const kind=c.kind==="theory"?(state.autoBuildMode==="theory"?"理論最佳":"理論補位"):c.kind==="taiwan"?"台灣實戰":"全球賽場";'''
          one(old,new,'card theory label')

          # Replace Auto Build controls event block with mode + region sync.
          old='''  $("#garageGenerate").addEventListener("click",generateGarageBuilds);\n  const autoRegionTabs=$("#autoBuildRegionTabs");\n  if(autoRegionTabs){\n    const syncAutoRegion=()=>autoRegionTabs.querySelectorAll("[data-auto-region]").forEach(b=>b.classList.toggle("active",b.dataset.autoRegion===state.autoBuildRegion));\n    syncAutoRegion();\n    autoRegionTabs.addEventListener("click",e=>{\n      const btn=e.target.closest("[data-auto-region]"); if(!btn) return;\n      const next=btn.dataset.autoRegion; if(!["global","taiwan"].includes(next)) return;\n      const hadResults=(state.garageResults||[]).length>0;\n      state.autoBuildRegion=next; safeStoreSet("beyx-auto-region",next); syncAutoRegion();\n      if(hadResults) generateGarageBuilds();\n      else{\n        state.garageResults=[]; renderGarageResults();\n        $("#autoBuildDesc").textContent=`已選 ${next==="taiwan"?"台灣實戰":"全球賽場"}；按「幫我配前 10 名」開始排序。`;\n      }\n    });\n  }'''
          new='''  $("#garageGenerate").addEventListener("click",generateGarageBuilds);\n  const autoModeTabs=$("#autoBuildModeTabs");\n  const autoRegionTabs=$("#autoBuildRegionTabs");\n  const syncAutoBuildControls=()=>{\n    if(!["battle","theory"].includes(state.autoBuildMode)) state.autoBuildMode="battle";\n    autoModeTabs?.querySelectorAll("[data-auto-mode]").forEach(b=>b.classList.toggle("active",b.dataset.autoMode===state.autoBuildMode));\n    autoRegionTabs?.querySelectorAll("[data-auto-region]").forEach(b=>b.classList.toggle("active",b.dataset.autoRegion===state.autoBuildRegion));\n    if(autoRegionTabs) autoRegionTabs.hidden=state.autoBuildMode==="theory";\n  };\n  syncAutoBuildControls();\n  if(autoModeTabs){\n    autoModeTabs.addEventListener("click",e=>{\n      const btn=e.target.closest("[data-auto-mode]"); if(!btn) return;\n      const next=btn.dataset.autoMode; if(!["battle","theory"].includes(next)) return;\n      const hadResults=(state.garageResults||[]).length>0;\n      state.autoBuildMode=next; safeStoreSet("beyx-auto-mode",next); syncAutoBuildControls();\n      if(hadResults) generateGarageBuilds();\n      else{\n        state.garageResults=[]; renderGarageResults();\n        $("#autoBuildDesc").textContent=next==="theory"\n          ? '已選「理論最佳」；只用你目前零件的能力值排序，按「幫我配前 10 名」開始。'\n          : `已選「實戰最佳」；目前使用 ${state.autoBuildRegion==="taiwan"?"台灣實戰":"全球賽場"} 資料，按「幫我配前 10 名」開始。`;\n      }\n    });\n  }\n  if(autoRegionTabs){\n    autoRegionTabs.addEventListener("click",e=>{\n      const btn=e.target.closest("[data-auto-region]"); if(!btn) return;\n      const next=btn.dataset.autoRegion; if(!["global","taiwan"].includes(next)) return;\n      const hadResults=(state.garageResults||[]).length>0;\n      state.autoBuildRegion=next; safeStoreSet("beyx-auto-region",next); syncAutoBuildControls();\n      if(hadResults) generateGarageBuilds();\n      else{\n        state.garageResults=[]; renderGarageResults();\n        $("#autoBuildDesc").textContent=`已選「實戰最佳」｜${next==="taiwan"?"台灣實戰":"全球賽場"}；按「幫我配前 10 名」開始排序。`;\n      }\n    });\n  }'''
          one(old,new,'auto build controls')

          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
          PY

          grep -q 'V23.9' index.html
          grep -q 'data-auto-mode="battle"' index.html
          grep -q 'autoBuildMode:safeStoreGet' index.html
          grep -q '純理論能力排序' index.html

      - name: Commit patch to site branch
        shell: bash
        run: |
          git config user.name "godsiman"
          git config user.email "120441322+godsiman@users.noreply.github.com"
          git add index.html
          git commit -m "V23.9 add battle vs theory Auto Build mode" || exit 0
          git push origin HEAD:beyblade-x-site
