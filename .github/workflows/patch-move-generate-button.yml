name: Patch move Auto Build generate button

on:
  push:
    branches: [main]
    paths:
      - '.move-generate-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beyblade-x-site
          fetch-depth: 0

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          one('>V23.9</span>','>V23.10</span>','version')

          old='''      <div class="garageActionRow">\n        <button id="garageGenerate" class="btn primary" type="button">⚡ 幫我配前 10 名</button>\n        <button id="garageClear" class="btn" type="button">清空我的陀螺</button>\n      </div>'''
          new='''      <div class="garageActionRow">\n        <button id="garageClear" class="btn" type="button">清空我的陀螺</button>\n      </div>'''
          one(old,new,'remove top generate button')

          old='''      <div id="autoBuildRegionTabs" class="autoBuildRegionTabs" aria-label="Auto Build 賽場地區">\n        <button type="button" class="active" data-auto-region="global">🌍 全球賽場</button>\n        <button type="button" data-auto-region="taiwan">🇹🇼 台灣實戰</button>\n      </div>\n      <div id="autoBuildResults" class="autoBuildResults">'''
          new='''      <div id="autoBuildRegionTabs" class="autoBuildRegionTabs" aria-label="Auto Build 賽場地區">\n        <button type="button" class="active" data-auto-region="global">🌍 全球賽場</button>\n        <button type="button" data-auto-region="taiwan">🇹🇼 台灣實戰</button>\n      </div>\n      <div class="autoBuildGenerateRow">\n        <button id="garageGenerate" class="btn primary" type="button">⚡ 幫我配前 10 名</button>\n      </div>\n      <div id="autoBuildResults" class="autoBuildResults">'''
          one(old,new,'insert generate button under selectors')

          css='''    .autoBuildRegionTabs button[data-auto-region="taiwan"].active{background:#123127;color:#7ce5ba;box-shadow:inset 0 0 0 1px rgba(41,211,145,.38)}\n'''
          css_new=css+'''    .autoBuildGenerateRow{display:flex;margin:0 0 12px}\n    .autoBuildGenerateRow .btn{width:100%;padding:12px 14px;font-size:11px}\n'''
          one(css,css_new,'generate row css')

          # Empty-state text should now point to the button immediately above it.
          one('先加入你有的陀螺，再按上面的自動配裝。','選好推薦方式後，按上方「幫我配前 10 名」。','empty state copy')

          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
          PY

          grep -q 'V23.10' index.html
          grep -q 'class="autoBuildGenerateRow"' index.html
          test "$(grep -o 'id="garageGenerate"' index.html | wc -l)" -eq 1

      - name: Commit patch to site branch
        shell: bash
        run: |
          git config user.name "godsiman"
          git config user.email "120441322+godsiman@users.noreply.github.com"
          git add index.html
          git commit -m "V23.10 move Auto Build action below selectors" || exit 0
          git push origin HEAD:beyblade-x-site
