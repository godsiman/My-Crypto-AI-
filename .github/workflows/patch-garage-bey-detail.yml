name: Patch garage bey detail

on:
  push:
    branches: [main]
    paths:
      - '.garage-bey-detail-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beyblade-x-site
          fetch-depth: 0

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          one('>V23.11</span>','>V23.12</span>','version')

          css='''    .garageBeyRow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:9px;align-items:center;border:1px solid var(--line);background:#0b1016;border-radius:11px;padding:8px}\n'''
          css_new=css+'''    .garageBeyRow[data-gdetail]{cursor:pointer;transition:border-color .15s,background .15s,transform .15s}\n    .garageBeyRow[data-gdetail]:hover,.garageBeyRow[data-gdetail]:focus-visible{border-color:#486078;background:#0e151e;outline:none}\n    .garageBeyRow[data-gdetail]:active{transform:scale(.995)}\n    .garageBeyInfo .garageOpenHint{display:inline-flex;margin-top:5px;color:#7ce5ba;font-size:8px;font-weight:900}\n    .beyDetailHero{display:grid;grid-template-columns:minmax(180px,280px) minmax(0,1fr);gap:16px;align-items:center}\n    .beyDetailWhole{background:#f4f6f8;border-radius:14px;min-height:220px;display:grid;place-items:center;overflow:hidden}\n    .beyDetailWhole img{display:block;max-width:100%;max-height:300px;width:auto;height:auto;object-fit:contain}\n    .beyDetailTitle h2{margin:5px 0 5px;font-size:22px}.beyDetailTitle p{margin:0;color:#8e9baa;font-size:10px;line-height:1.5}\n    .beyDetailParts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:15px}\n    .beyPartCard{border:1px solid var(--line);background:#0b1016;border-radius:12px;padding:9px;text-align:left;color:var(--text);cursor:pointer;min-width:0}\n    .beyPartCard:hover{border-color:#486078;background:#0f1721}.beyPartImg{height:92px;border-radius:9px;background:#f4f6f8;display:grid;place-items:center;overflow:hidden}\n    .beyPartImg img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.beyPartCard strong{display:block;margin-top:7px;font-size:10px;line-height:1.35}.beyPartCard small{display:block;margin-top:3px;color:#8290a0;font-size:8px;line-height:1.35}\n    .beyDetailNote{margin-top:10px;color:#8290a0;font-size:9px;line-height:1.5}.beySetGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}.beySetItem{border:1px solid var(--line);background:#0b1016;border-radius:12px;padding:9px;color:var(--text);text-align:left;cursor:pointer}.beySetItem img{display:block;width:100%;height:150px;object-fit:contain;background:#f4f6f8;border-radius:9px}.beySetItem b{display:block;margin-top:7px;font-size:10px}\n    @media(max-width:700px){.beyDetailHero{grid-template-columns:1fr}.beyDetailWhole{min-height:180px}.beyDetailParts{grid-template-columns:repeat(2,minmax(0,1fr))}.beySetGrid{grid-template-columns:1fr}}\n'''
          one(css,css_new,'garage detail css')

          marker='''  function renderGarageBeys(){\n'''
          helper='''  const BEY_DETAIL_SLOT_ORDER=["blade","lock","main","assist","metal","over","ratchet","bit"];\n\n  function garageEntryPartRows(entry){\n    if(!entry) return [];\n    return BEY_DETAIL_SLOT_ORDER.map(slot=>[slot,entry.parts?.[slot]]).filter(([slot,p])=>{\n      if(!p) return false;\n      if(entry.integrated && slot==="ratchet") return false;\n      return true;\n    });\n  }\n\n  function showGarageBeyDetail(entry){\n    if(!entry) return;\n    const dlg=$("#partDialog");\n    const content=$("#dialogContent");\n    if(entry.kind==="set"){\n      const beys=entry.set?.beys||[];\n      content.innerHTML=`<div class="detailInfo"><div class="eyebrow">MY BEYS / SET</div><div class="detailTitle">${esc(entry.code)}｜${esc(entry.title)}</div><div class="detailDesc">這是整盒套裝。點下面任一顆，可以再看整顆圖片與它的原廠零件。</div><div class="beySetGrid">${beys.map((b,i)=>`<button type="button" class="beySetItem" data-setdetail="${i}">${b.image?`<img src="${esc(b.image)}" alt="${esc(b.name)}">`:""}<b>${esc(b.name)}</b></button>`).join("")}</div></div>`;\n      content.querySelectorAll("[data-setdetail]").forEach(btn=>btn.addEventListener("click",()=>{\n        const b=beys[Number(btn.dataset.setdetail)]; if(!b) return;\n        showGarageBeyDetail({kind:"setbey",code:entry.code,title:b.name,image:b.image,parts:resolvePartMap(b.parts||{blade:b.blade,ratchet:b.ratchet,bit:b.bit}),integrated:!!b.ratchetIntegrated});\n      }));\n      if(typeof dlg.showModal==="function" && !dlg.open) dlg.showModal(); else dlg.setAttribute("open","");\n      return;\n    }\n\n    const rows=garageEntryPartRows(entry);\n    const structure=entry.integrated?"UX Expand／Ratchet 一體結構":rows.some(([slot])=>["lock","main","assist"].includes(slot))?"CX 可拆上蓋結構":"BX / UX 標準結構";\n    content.innerHTML=`<div class="beyDetailHero"><div class="beyDetailWhole">${entry.image?`<img src="${esc(entry.image)}" alt="${esc(entry.title)}">`:`<div class="fallback">目前沒有整顆圖片</div>`}</div><div class="beyDetailTitle"><div class="eyebrow">MY BEY / ORIGINAL PARTS</div><h2>${esc(entry.code)}｜${esc(entry.title)}</h2><p>${esc(structure)}</p><div class="detailDesc">點下面任一零件，可看零件實物圖、能力資料，以及還有哪些原廠陀螺也有這個零件。</div></div></div><div class="beyDetailParts">${rows.map(([slot,p],i)=>{const src=findImage(p);return `<button type="button" class="beyPartCard" data-beypart="${i}"><div class="beyPartImg">${src?`<img src="${esc(src)}" alt="${esc(displayNameForPart(p))}">`:`<span class="fallback">無圖</span>`}</div><strong>${esc(LABELS[slot]||slot)}｜${esc(displayNameForPart(p))}</strong><small>${esc(typeLabelZh(p.type)||"")}</small></button>`}).join("")}</div><div class="beyDetailNote">這裡顯示的是這顆原廠配置；你之後改裝過的配法不會覆蓋原廠零件資料。</div>`;\n    content.querySelectorAll("[data-beypart]").forEach(btn=>btn.addEventListener("click",()=>{\n      const row=rows[Number(btn.dataset.beypart)]; if(row?.[1]) showPartDetail(row[1]);\n    }));\n    if(typeof dlg.showModal==="function" && !dlg.open) dlg.showModal(); else dlg.setAttribute("open","");\n  }\n\n'''+marker
          one(marker,helper,'detail helper')

          old='''      return `<div class="garageBeyRow">\n        <div class="garageBeyImg">${e.image?`<img src="${esc(e.image)}" alt="${esc(e.title)}">`:""}</div>\n        <div class="garageBeyInfo"><b>${esc(e.code)} ${esc(e.title)}</b><span>${esc(e.label)}</span></div>\n        <div class="qtyCtrl"><button type="button" data-gminus="${esc(item.id)}">−</button><strong>${item.qty||1}</strong><button type="button" data-gplus="${esc(item.id)}">＋</button></div>\n      </div>`;\n    }).join("");\n    box.querySelectorAll("[data-gminus]").forEach(b=>b.addEventListener("click",()=>garageChangeQty(b.dataset.gminus,-1)));\n    box.querySelectorAll("[data-gplus]").forEach(b=>b.addEventListener("click",()=>garageChangeQty(b.dataset.gplus,1)));'''
          new='''      return `<div class="garageBeyRow" data-gdetail="${esc(item.id)}" role="button" tabindex="0" aria-label="查看 ${esc(e.code)} ${esc(e.title)} 的原廠零件">\n        <div class="garageBeyImg">${e.image?`<img src="${esc(e.image)}" alt="${esc(e.title)}">`:""}</div>\n        <div class="garageBeyInfo"><b>${esc(e.code)} ${esc(e.title)}</b><span>${esc(e.label)}</span><span class="garageOpenHint">點我看整顆與原廠零件 ›</span></div>\n        <div class="qtyCtrl"><button type="button" data-gminus="${esc(item.id)}" aria-label="減少數量">−</button><strong>${item.qty||1}</strong><button type="button" data-gplus="${esc(item.id)}" aria-label="增加數量">＋</button></div>\n      </div>`;\n    }).join("");\n    box.querySelectorAll("[data-gminus]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();garageChangeQty(b.dataset.gminus,-1)}));\n    box.querySelectorAll("[data-gplus]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();garageChangeQty(b.dataset.gplus,1)}));\n    box.querySelectorAll("[data-gdetail]").forEach(row=>{\n      const open=()=>showGarageBeyDetail(garageEntryById(row.dataset.gdetail));\n      row.addEventListener("click",e=>{if(!e.target.closest(".qtyCtrl")) open();});\n      row.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});\n    });'''
          one(old,new,'garage cards clickable')

          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
          PY

          grep -q 'V23.12' index.html
          grep -q 'function showGarageBeyDetail' index.html
          grep -q '點我看整顆與原廠零件' index.html

      - name: Commit patch to site branch
        shell: bash
        run: |
          git config user.name "godsiman"
          git config user.email "120441322+godsiman@users.noreply.github.com"
          git add index.html
          git commit -m "V23.12 add My Bey detail and original parts view" || exit 0
          git push origin HEAD:beyblade-x-site
