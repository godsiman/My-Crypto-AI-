name: Patch product-specific My Bey parts

on:
  push:
    branches: [main]
    paths:
      - '.product-specific-parts-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beyblade-x-site
          fetch-depth: 0

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          one('>V23.12</span>','>V23.13</span>','version')

          old='''    parts:{lock:"TIGA",metal:"RAGE",over:"F",assist:"T",ratchet:"3-60",bit:"T"},\n    note:"超人力霸王迪卡聯名；可換色重現 Multi / Sky / Power 三種型態。"'''
          new='''    parts:{lock:"TIGA",metal:"RAGE",over:"F",assist:"T",ratchet:"3-60",bit:"T"},\n    partLabels:{\n      lock:"Lock Chip 紋章｜迪卡",\n      metal:"Metal Blade 金屬刃｜狂怒 Rage",\n      over:"Over Blade 外環｜F",\n      assist:"Assist Blade 輔刃｜T",\n      ratchet:"Ratchet 齒輪｜3-60｜3刃・6.0mm",\n      bit:"Bit 軸心｜T｜錐軸"\n    },\n    partVariantIds:{\n      lock:"BL-PRD-080545-01",metal:"BL-PRD-080638-01",over:"BL-PRD-080679-01",\n      assist:"BL-PRD-080683-01",ratchet:"BL-PRD-080639-01",bit:"BL-PRD-080640-01"\n    },\n    exactParts:true,\n    note:"超人力霸王迪卡聯名；可換色重現 Multi / Sky / Power 三種型態。"'''
          one(old,new,'tiga exact metadata')

          old='''      out.push({id:"special:"+sp.id,kind:"special",ref:sp.id,label:`${sp.code}｜${sp.title}【${specialTypeLabel(sp)}】`,code:sp.code,title:sp.title,image:sp.image,parts:resolvePartMap(sp.parts||{}),integrated:!!sp.ratchetIntegrated});'''
          new='''      out.push({id:"special:"+sp.id,kind:"special",ref:sp.id,label:`${sp.code}｜${sp.title}【${specialTypeLabel(sp)}】`,code:sp.code,title:sp.title,image:sp.image,parts:resolvePartMap(sp.parts||{}),partSpec:sp.parts||{},partImages:sp.partImages||{},partLabels:sp.partLabels||{},partVariantIds:sp.partVariantIds||{},exactParts:!!sp.exactParts,official:sp.official||"",integrated:!!sp.ratchetIntegrated});'''
          one(old,new,'special catalog context')

          old='''          label:`${set.code}｜[單顆] ${bey.name}【${setBeyTypeLabel(bey)}】`,code:set.code,title:bey.name,image:bey.image,\n          parts:resolvePartMap(bey.parts||{blade:bey.blade,ratchet:bey.ratchet,bit:bey.bit}),integrated:!!bey.ratchetIntegrated'''
          new='''          label:`${set.code}｜[單顆] ${bey.name}【${setBeyTypeLabel(bey)}】`,code:set.code,title:bey.name,image:bey.image,\n          parts:resolvePartMap(bey.parts||{blade:bey.blade,ratchet:bey.ratchet,bit:bey.bit}),partSpec:bey.parts||{blade:bey.blade,ratchet:bey.ratchet,bit:bey.bit},partImages:bey.partImages||{},partLabels:bey.partLabels||{},setId:set.id,beyId:bey.id,official:set.official||"",integrated:!!bey.ratchetIntegrated'''
          one(old,new,'setbey catalog context')

          marker='''  function showGarageBeyDetail(entry){\n'''
          helper='''  function garageEntryPartLabel(entry,slot,p){\n    return entry?.partLabels?.[slot] || `${LABELS[slot]||slot}｜${displayNameForPart(p)}`;\n  }\n\n  function garageEntryPartImage(entry,slot,p){\n    if(!entry || !p) return "";\n    if(entry.partImages?.[slot]) return entry.partImages[slot];\n\n    // UX-21 has verified product-specific official part images.\n    if(entry.kind==="setbey"){\n      if(entry.beyId==="UX21-01" && slot==="blade") return "https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/UX21_02%401.png";\n      if(entry.beyId==="UX21-01" && slot==="bit") return "https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/UX21_04%401.png";\n      if(entry.beyId==="UX21-02" && slot==="blade") return "https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/UX21_05%401.png";\n      if(entry.beyId==="UX21-02" && slot==="bit") return "https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/UX21_08%401.png";\n      if(entry.beyId==="UX21-03" && slot==="blade") return "https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/UX21_09%401.png";\n      if(entry.beyId==="UX21-03" && slot==="bit") return "https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/UX21_12%401.png";\n    }\n\n    // Special / collaboration products must never borrow a generic same-code image\n    // from another Bey. If the product-specific picture is not verified, show no\n    // picture rather than a misleading colour/shape.\n    if(entry.kind==="special" || entry.kind==="setbey") return "";\n    return findImage(p);\n  }\n\n'''+marker
          one(marker,helper,'garage image helper')

          old='''    content.innerHTML=`<div class="beyDetailHero"><div class="beyDetailWhole">${entry.image?`<img src="${esc(entry.image)}" alt="${esc(entry.title)}">`:`<div class="fallback">目前沒有整顆圖片</div>`}</div><div class="beyDetailTitle"><div class="eyebrow">MY BEY / ORIGINAL PARTS</div><h2>${esc(entry.code)}｜${esc(entry.title)}</h2><p>${esc(structure)}</p><div class="detailDesc">點下面任一零件，可看零件實物圖、能力資料，以及還有哪些原廠陀螺也有這個零件。</div></div></div><div class="beyDetailParts">${rows.map(([slot,p],i)=>{const src=findImage(p);return `<button type="button" class="beyPartCard" data-beypart="${i}"><div class="beyPartImg">${src?`<img src="${esc(src)}" alt="${esc(displayNameForPart(p))}">`:`<span class="fallback">無圖</span>`}</div><strong>${esc(LABELS[slot]||slot)}｜${esc(displayNameForPart(p))}</strong><small>${esc(typeLabelZh(p.type)||"")}</small></button>`}).join("")}</div><div class="beyDetailNote">這裡顯示的是這顆原廠配置；你之後改裝過的配法不會覆蓋原廠零件資料。</div>`;\n    content.querySelectorAll("[data-beypart]").forEach(btn=>btn.addEventListener("click",()=>{\n      const row=rows[Number(btn.dataset.beypart)]; if(row?.[1]) showPartDetail(row[1]);\n    }));'''
          new='''    const strictProductImages=entry.kind==="special" || entry.kind==="setbey";\n    content.innerHTML=`<div class="beyDetailHero"><div class="beyDetailWhole">${entry.image?`<img src="${esc(entry.image)}" alt="${esc(entry.title)}">`:`<div class="fallback">目前沒有整顆圖片</div>`}</div><div class="beyDetailTitle"><div class="eyebrow">MY BEY / ORIGINAL PARTS</div><h2>${esc(entry.code)}｜${esc(entry.title)}</h2><p>${esc(structure)}</p><div class="detailDesc">${strictProductImages?"上方優先顯示這個商品自己的官方整顆／拆件素材；下方零件只有核對到商品專屬圖片才顯示，不會再拿別顆同代號零件的配色圖代替。":"點下面任一零件，可看零件實物圖、能力資料，以及還有哪些原廠陀螺也有這個零件。"}</div></div></div><div class="beyDetailParts">${rows.map(([slot,p],i)=>{const src=garageEntryPartImage(entry,slot,p),label=garageEntryPartLabel(entry,slot,p),vid=entry.partVariantIds?.[slot]||"";return `<button type="button" class="beyPartCard" data-beypart="${i}"><div class="beyPartImg">${src?`<img src="${esc(src)}" alt="${esc(label)}">`:`<span class="fallback">此商品專屬配色圖<br>尚未核對</span>`}</div><strong>${esc(label)}</strong><small>${esc(vid?`原廠分件 ${vid}`:(typeLabelZh(p.type)||""))}</small></button>`}).join("")}</div><div class="beyDetailNote">這裡只顯示這顆原廠配置。特殊／限定配色若沒有商品專屬零件圖，就留白標示，不再用其他商品的共用圖冒充。</div>`;\n    content.querySelectorAll("[data-beypart]").forEach(btn=>btn.addEventListener("click",()=>{\n      const row=rows[Number(btn.dataset.beypart)];\n      if(row?.[1]){\n        const [slot,p]=row;\n        showPartDetail(p,{image:garageEntryPartImage(entry,slot,p),strictImage:strictProductImages,label:garageEntryPartLabel(entry,slot,p),product:`${entry.code}｜${entry.title}`});\n      }\n    }));'''
          one(old,new,'garage detail render')

          old='''  function showPartDetail(p){\n    const meta=metaForPart(p);\n    const src=findImage(p);'''
          new='''  function showPartDetail(p,context=null){\n    const meta=metaForPart(p);\n    const src=context?.image || (context?.strictImage ? "" : findImage(p));\n    const detailTitle=context?.label || (p.zh||p.en);'''
          one(old,new,'context detail signature')

          old='''        <div class="detailTitle">${esc(p.zh||p.en)}</div>\n        <div class="detailEn">${esc(p.en)} · ${esc(TYPE_ZH[p.type]||p.type||"—")} · 發售 ${esc(formatRelease(p))}</div>'''
          new='''        <div class="detailTitle">${esc(detailTitle)}</div>\n        <div class="detailEn">${context?.product?`${esc(context.product)} · `:""}${esc(p.en)} · ${esc(TYPE_ZH[p.type]||p.type||"—")} · 發售 ${esc(formatRelease(p))}</div>'''
          one(old,new,'context detail title')

          old='''      <div class="detailVisual">${src?`<img src="${esc(src)}" alt="${esc(p.zh||p.en)}">`:`<div class="fallback">目前沒有可用實物圖<br>${esc(p.en)}</div>`}</div>'''
          new='''      <div class="detailVisual">${src?`<img src="${esc(src)}" alt="${esc(detailTitle)}">`:`<div class="fallback">${context?.strictImage?"此商品的專屬配色零件圖尚未核對<br>不以其他商品圖片代替":"目前沒有可用實物圖"}<br>${esc(p.en)}</div>`}</div>'''
          one(old,new,'context detail image')

          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
          PY

          grep -q 'V23.13' index.html
          grep -q 'BL-PRD-080545-01' index.html
          grep -q 'garageEntryPartImage' index.html
          grep -q '不以其他商品圖片代替' index.html

      - name: Commit patch to site branch
        shell: bash
        run: |
          git config user.name "godsiman"
          git config user.email "120441322+godsiman@users.noreply.github.com"
          git add index.html
          git commit -m "V23.13 fix My Bey product-specific part images" || exit 0
          git push origin HEAD:beyblade-x-site
