name: Patch UX-19 into Beyblade site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beyblade-x-site
          fetch-depth: 0
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'const SPECIAL_PRODUCTS = [\n'
          item = '''  {\n    id:"SPECIAL:UX19-BULLETGRIFFON",code:"UX-19",line:"UX",kind:"starter",category:"Starter / UX Expand",\n    title:"子彈獅鷲 H",release:"2026-04-25",priceJP:"¥2,600",\n    image:"https://raw.githubusercontent.com/Sun-After-the-Reign/Beyblade-X-Parts-Image-Database/master/Blade/BulletGriffon.png",\n    official:"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux19.html",\n    parts:{blade:"BULLETGRIFFON",bit:"H"},\n    ratchetIntegrated:true,\n    note:"UX Expand：Ratchet 整合於 Blade；戰鬥中可分身，官方原配 H Bit。"\n  },\n'''
          if 'SPECIAL:UX19-BULLETGRIFFON' not in s:
              if marker not in s:
                  raise SystemExit('SPECIAL_PRODUCTS marker not found')
              s = s.replace(marker, marker + item, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit to site branch if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "UX-19 already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix garage catalog: add UX-19 Bullet Griffon H"
          git push origin HEAD:beyblade-x-site
