name: Patch Auto Build region and part sources

on:
  push:
    branches: [main]
    paths:
      - '.auto-build-region-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beyblade-x-site
          fetch-depth: 0

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          def repl(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              s = s.replace(old, new, 1)

          repl(
          '''    .autoBuildLegend{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.autoBuildLegend span{border:1px solid var(--line);border-radius:999px;padding:5px 7px;font-size:8px;font-weight:900}\n    .evidenceMeta{color:#7ce5ba!important;border-color:rgba(41,211,145,.3)!important;background:rgba(41,211,145,.06)!important}\n''',
          '''    .autoBuildLegend{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.autoBuildLegend span{border:1px solid var(--line);border-radius:999px;padding:5px 7px;font-size:8px;font-weight:900}\n    .autoBuildRegionTabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 12px;padding:4px;border:1px solid var(--line);background:#0b1016;border-radius:11px}\n    .autoBuildRegionTabs button{border:0;border-radius:8px;padding:9px 10px;background:transparent;color:#98a5b4;font-size:10px;font-weight:900}\n    .autoBuildRegionTabs button.active{background:#24303e;color:#fff;box-shadow:inset 0 0 0 1px #3a495b}\n    .autoBuildRegionTabs button[data-auto-region="taiwan"].active{background:#123127;color:#7ce5ba;box-shadow:inset 0 0 0 1px rgba(41,211,145,.38)}\n    .evidenceMeta{color:#7ce5ba!important;border-color:rgba(41,211,145,.3)!important;background:rgba(41,211,145,.06)!important}\n''',
          'css region tabs')

          repl(
          '''    .autoBuildMeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}\n    .autoBuildMeta span{border:1px solid var(--line);border-radius:999px;padding:4px 6px;font-size:8px;color:#c3cdd8}\n    .autoBuildScore{margin-top:7px;font-size:9px;color:#9aa7b6}\n''',
          '''    .autoBuildMeta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}\n    .autoBuildMeta span{border:1px solid var(--line);border-radius:9px;padding:6px 7px;font-size:8px;color:#c3cdd8;min-width:0}\n    .autoBuildMeta span b{display:block;font-size:9px;color:#eef3f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n    .autoBuildMeta span small{display:block;margin-top:3px;font-size:8px;line-height:1.35;color:#7ce5ba;white-space:normal}\n    .autoBuildScore{margin-top:7px;font-size:9px;color:#9aa7b6}\n''',
          'css part source labels')

          repl(
          '''        <div class="autoBuildLegend">\n          <span class="evidenceMeta">賽場實證</span>\n          <span class="evidenceTheory">理論補位</span>\n        </div>\n      </div>\n      <div id="autoBuildResults" class="autoBuildResults">\n''',
          '''        <div class="autoBuildLegend">\n          <span class="evidenceMeta">賽場實證</span>\n          <span class="evidenceTheory">理論補位</span>\n        </div>\n      </div>\n      <div id="autoBuildRegionTabs" class="autoBuildRegionTabs" aria-label="Auto Build 賽場地區">\n        <button type="button" class="active" data-auto-region="global">🌍 全球賽場</button>\n        <button type="button" data-auto-region="taiwan">🇹🇼 台灣實戰</button>\n      </div>\n      <div id="autoBuildResults" class="autoBuildResults">\n''',
          'html region tabs')

          repl(
          '''    garageItems:safeJsonArray("beyx-garage"),\n    garageResults:[]\n''',
          '''    garageItems:safeJsonArray("beyx-garage"),\n    garageResults:[],\n    autoBuildRegion:safeStoreGet("beyx-auto-region","global") || "global"\n''',
          'state region')

          repl(
          '''        const id=partId(p);\n        if(!map.has(id)) map.set(id,{id,slot,p,qty:0});\n        map.get(id).qty++;\n''',
          '''        const id=partId(p);\n        const sourceLabel=[bey.code,bey.name].filter(Boolean).join("｜");\n        if(!map.has(id)) map.set(id,{id,slot,p,qty:0,sources:[]});\n        const bucket=map.get(id);\n        bucket.qty++;\n        if(sourceLabel && !bucket.sources.includes(sourceLabel)) bucket.sources.push(sourceLabel);\n''',
          'inventory sources')

          marker = '''    return map;\n  }\n\n  function garageEntrySearchText(x){'''
          insert = '''    return map;\n  }\n\n  function garagePartSourceLabel(p,inv=null){\n    if(!p) return "";\n    const id=partId(p);\n    const inventory=inv || garageInventory();\n    const owned=inventory.get(id)?.sources?.[0];\n    if(owned) return owned;\n    for(const entry of garageCatalogEntries()){\n      if(entry.kind==="set"){\n        for(const bey of entry.set?.beys||[]){\n          const parts=resolvePartMap(bey.parts||{blade:bey.blade,ratchet:bey.ratchet,bit:bey.bit});\n          if(Object.values(parts).some(x=>x && partId(x)===id)) return [entry.code,bey.name].filter(Boolean).join("｜");\n        }\n      }else if(Object.values(entry.parts||{}).some(x=>x && partId(x)===id)){\n        return [entry.code,entry.title].filter(Boolean).join("｜");\n      }\n    }\n    return "";\n  }\n\n  function garageEntrySearchText(x){'''
          repl(marker, insert, 'part source helper')

          repl(
          '''    for(const blade of blades){\n      for(const b of globalRecoBuilds(blade)){\n        const r=b.ratchet?findPart("ratchet",b.ratchet):null, bit=b.bit?findPart("bit",b.bit):null;\n        if(bit) addCandidate(blade,r,bit,"meta",metaScoreForCandidate(blade,b),`全球賽場：${b.evidence||""}`);\n      }\n      for(const b of taiwanRecoBuilds(blade)){\n        const r=b.ratchet?findPart("ratchet",b.ratchet):null, bit=b.bit?findPart("bit",b.bit):null;\n        if(bit) addCandidate(blade,r,bit,"taiwan",760-b.rank*8,`台灣實戰：${b.evidence||""}`);\n      }\n    }\n''',
          '''    const autoRegion=state.autoBuildRegion==="taiwan"?"taiwan":"global";\n    for(const blade of blades){\n      if(autoRegion==="global"){\n        for(const b of globalRecoBuilds(blade)){\n          const r=b.ratchet?findPart("ratchet",b.ratchet):null, bit=b.bit?findPart("bit",b.bit):null;\n          if(bit) addCandidate(blade,r,bit,"meta",metaScoreForCandidate(blade,b),`全球賽場：${b.evidence||""}`);\n        }\n      }else{\n        for(const b of taiwanRecoBuilds(blade)){\n          const r=b.ratchet?findPart("ratchet",b.ratchet):null, bit=b.bit?findPart("bit",b.bit):null;\n          if(bit) addCandidate(blade,r,bit,"taiwan",760-b.rank*8,`台灣實戰：${b.evidence||""}`);\n        }\n      }\n    }\n''',
          'region candidate filter')

          repl(
          '''    state.garageResults=chosen; renderGarageResults();\n    $("#autoBuildDesc").textContent=`${unique?"零件不重複・可同時組裝":"可重複・候選配法"}｜共找到 ${chosen.length} 組；優先賽場實證，不足再用理論能力補位。`;\n    toast(`已排出 ${chosen.length} 組`);\n''',
          '''    state.garageResults=chosen; renderGarageResults();\n    const regionLabel=state.autoBuildRegion==="taiwan"?"台灣實戰":"全球賽場";\n    $("#autoBuildDesc").textContent=`${unique?"零件不重複・可同時組裝":"可重複・候選配法"}｜${regionLabel}｜共找到 ${chosen.length} 組；該賽場資料不足時再用理論能力補位。`;\n    toast(`已排出 ${chosen.length} 組｜${regionLabel}`);\n''',
          'generation description')

          repl(
          '''    const rows=state.garageResults||[];\n    if(!rows.length){box.innerHTML='<div class="garageEmpty" style="grid-column:1/-1">先加入你有的陀螺，再按「幫我配前 10 名」。</div>';return;}\n    box.innerHTML=rows.map((c,i)=>{\n      const d=metaDisplayForName(c.blade.en||c.blade.zh);\n''',
          '''    const rows=state.garageResults||[];\n    if(!rows.length){box.innerHTML='<div class="garageEmpty" style="grid-column:1/-1">先加入你有的陀螺，再按「幫我配前 10 名」。</div>';return;}\n    const inv=garageInventory();\n    box.innerHTML=rows.map((c,i)=>{\n      const d=metaDisplayForName(c.blade.en||c.blade.zh);\n      const bladeSource=garagePartSourceLabel(c.blade,inv);\n      const ratchetSource=c.ratchet?garagePartSourceLabel(c.ratchet,inv):bladeSource;\n      const bitSource=garagePartSourceLabel(c.bit,inv);\n''',
          'render source variables')

          repl(
          '''        <div class="autoBuildMeta"><span>${esc(c.ratchet?displayNameForPart(c.ratchet):"Ratchet 一體")}</span><span>${esc(displayNameForPart(c.bit))}</span></div>\n''',
          '''        <div class="autoBuildMeta"><span><b>${esc(c.ratchet?displayNameForPart(c.ratchet):"Ratchet 一體")}</b><small>${esc(ratchetSource||"來源未標記")}</small></span><span><b>${esc(displayNameForPart(c.bit))}</b><small>${esc(bitSource||"來源未標記")}</small></span></div>\n''',
          'render part sources')

          repl(
          '''  $("#garageGenerate").addEventListener("click",generateGarageBuilds);\n  $("#garageClear").addEventListener("click",()=>{\n''',
          '''  $("#garageGenerate").addEventListener("click",generateGarageBuilds);\n  const autoRegionTabs=$("#autoBuildRegionTabs");\n  if(autoRegionTabs){\n    const syncAutoRegion=()=>autoRegionTabs.querySelectorAll("[data-auto-region]").forEach(b=>b.classList.toggle("active",b.dataset.autoRegion===state.autoBuildRegion));\n    syncAutoRegion();\n    autoRegionTabs.addEventListener("click",e=>{\n      const btn=e.target.closest("[data-auto-region]"); if(!btn) return;\n      const next=btn.dataset.autoRegion; if(!["global","taiwan"].includes(next)) return;\n      const hadResults=(state.garageResults||[]).length>0;\n      state.autoBuildRegion=next; safeStoreSet("beyx-auto-region",next); syncAutoRegion();\n      if(hadResults) generateGarageBuilds();\n      else{\n        state.garageResults=[]; renderGarageResults();\n        $("#autoBuildDesc").textContent=`已選 ${next==="taiwan"?"台灣實戰":"全球賽場"}；按「幫我配前 10 名」開始排序。`;\n      }\n    });\n  }\n  $("#garageClear").addEventListener("click",()=>{\n''',
          'region tab events')

          path.write_text(s, encoding='utf-8')
          print('patched', len(s))
          PY

          grep -q 'id="autoBuildRegionTabs"' index.html
          grep -q 'garagePartSourceLabel' index.html
          grep -q 'beyx-auto-region' index.html

          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/beyblade-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/beyblade-main.js

      - name: Commit patch to site branch
        shell: bash
        run: |
          git config user.name "godsiman"
          git config user.email "120441322+godsiman@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "V23.6 add Global/Taiwan Auto Build selector and part source labels"
            git push origin HEAD:beyblade-x-site
          fi
