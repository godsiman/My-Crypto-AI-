name: Patch safe garage clear

on:
  push:
    branches: [main]
    paths:
      - '.safe-garage-clear-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beyblade-x-site
          fetch-depth: 0

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          one('>V23.10</span>','>V23.11</span>','version')

          old='''      <div class="garageActionRow">\n        <button id="garageClear" class="btn" type="button">清空我的陀螺</button>\n      </div>'''
          new='''      <div class="garageActionRow">\n        <button id="garageClear" class="btn" type="button">清空我的陀螺</button>\n        <button id="garageRestore" class="btn" type="button" hidden>↩ 復原上次清空</button>\n        <span class="garageDangerHint">清空前會再次確認，並自動保留一份可復原備份。</span>\n      </div>'''
          one(old,new,'clear html')

          css='''    .garageActionRow{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}\n'''
          css_new=css+'''    .garageDangerHint{flex-basis:100%;color:#7f8b99;font-size:8px;line-height:1.4}\n'''
          one(css,css_new,'danger hint css')

          old='''  $("#garageClear").addEventListener("click",()=>{\n    state.garageItems=[]; state.garageResults=[]; garageSave(); renderGarage(); toast("已清空我的陀螺");\n  });'''
          new='''  const garageRestoreBtn=$("#garageRestore");\n  const garageBackupItems=()=>safeJsonArray("beyx-garage-backup");\n  const syncGarageRestore=()=>{ if(garageRestoreBtn) garageRestoreBtn.hidden=!garageBackupItems().length; };\n  syncGarageRestore();\n  $("#garageClear").addEventListener("click",()=>{\n    if(!state.garageItems.length){ toast("目前沒有陀螺可清空"); return; }\n    const count=garageExpandedBeys().length;\n    const ok=window.confirm(`確定要清空目前 ${count} 顆陀螺嗎？\\n\\n清空前會自動備份；如果按錯，可用「復原上次清空」找回。`);\n    if(!ok) return;\n    safeStoreSet("beyx-garage-backup",JSON.stringify(state.garageItems));\n    state.garageItems=[]; state.garageResults=[]; garageSave(); renderGarage(); syncGarageRestore();\n    toast("已清空；可按「復原上次清空」找回");\n  });\n  garageRestoreBtn?.addEventListener("click",()=>{\n    const backup=garageBackupItems();\n    if(!backup.length){ syncGarageRestore(); toast("目前沒有可復原的備份"); return; }\n    if(state.garageItems.length){\n      const currentCount=garageExpandedBeys().length;\n      const ok=window.confirm(`目前清單已有 ${currentCount} 顆。\\n\\n復原會用上次清空前的清單取代目前內容，確定繼續嗎？`);\n      if(!ok) return;\n    }\n    state.garageItems=backup; state.garageResults=[]; garageSave();\n    safeStoreSet("beyx-garage-backup","[]");\n    renderGarage(); syncGarageRestore();\n    toast("已復原上次清空前的陀螺清單");\n  });'''
          one(old,new,'safe clear handlers')

          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
          PY

          grep -q 'V23.11' index.html
          grep -q 'garageRestore' index.html
          grep -q 'beyx-garage-backup' index.html
          grep -q 'window.confirm' index.html

      - name: Commit patch to site branch
        shell: bash
        run: |
          git config user.name "godsiman"
          git config user.email "120441322+godsiman@users.noreply.github.com"
          git add index.html
          git commit -m "V23.11 make garage clear recoverable" || exit 0
          git push origin HEAD:beyblade-x-site
